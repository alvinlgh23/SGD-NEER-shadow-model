name: Update dashboard data

on:
  schedule:
    - cron: "0 23 * * 1-5"   # weekdays 23:00 UTC (07:00 SGT), after Asian and European FX closes
  workflow_dispatch:          # manual "Run workflow" button

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q tests

      - name: Export fresh data
        env:
          MPLBACKEND: Agg
        run: python export_web.py

      - name: Commit data if it changed
        run: |
          if git diff --quiet -- docs/data.json; then
            echo "No data change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          git commit -m "Update dashboard data ($(date -u +%Y-%m-%d))"
          git push
